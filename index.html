<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Atrament</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI -->
    <div id="ui">
      <div id="ink-meter">
        <div id="ink-fill"></div>
      </div>
      <div id="depth">Depth 1</div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>
      <button id="jump-btn">JUMP</button>
    </div>

    <!-- Menu -->
    <div id="menu" class="screen">
      <img src="https://iili.io/CZiKQyl.md.jpg" alt="Atrament Logo" id="logo" />
      <button id="start-btn">Begin Writing</button>
    </div>

    <!-- Game Over -->
    <div id="gameover" class="screen hidden">
      <h2>The Page is Lost</h2>
      <p id="final-depth">Depth reached: 1</p>
      <button id="retry-btn">Rewrite</button>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ink.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
